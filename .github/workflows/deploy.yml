name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: contact-manager
        run: npm install

      - name: Build app
        working-directory: contact-manager
        run: npm run build
      # keep the Checkout, Setup Node, Install dependencies and Build app steps
      # after the build step, add:

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: contact-manager/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

